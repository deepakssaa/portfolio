<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;600&family=Unbounded:wght@200..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <title>Deepak | Authentication</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="Stylesheet" href="login_style.css">
</head>

<body class="color-change-2x">
    <div class="content">
        <img src="assets/login.jpg" draggable="false" class="img">
        <div class="column">
            <h1>Auth<span>entication</span></h1>
            <form id="loginForm" method="POST">
                <input id="email" class="email " type="email" name="email" placeholder="Enter your email address">
                <div class="password-wrapper">
                    <input id="password" class="password" type="password" name="password" placeholder="Password">

                    <i class="ri-eye-fill toggle-password" id="eyeOpen"></i>
                    <i class="ri-eye-off-fill toggle-password hidden" id="eyeClose"></i>
                </div>

                <button type="submit" class="button">Login</button>
                <div class="extrabuttons">
                    <a href="portfolio.php?guest=1">
                        <button type="button" class="guest">Continue without Login</button>
                    </a>
                    <a href="db.html">
                        <button type="button" class="db">
                            Visit DB
                        </button>
                    </a>
                </div>
            </form>
            <section class="bottom">
                <p>Forgot <a class="Forgot" href="#" id="forgotPassword">
                        Username/password?
                    </a></p>
            </section>
        </div>

    </div>
    <script type="module" src="login.js"></script>
</body>

</html>
